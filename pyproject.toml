[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-data-platform"
version = "0.1.0"
description = "Source-agnostic football data platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2025.2",
]

[project.scripts]
fdp = "football_data_platform.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
football_data_platform = ["resources/*.toml"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
